name: vae_conv_cifar10
seed: 0
data:
  dataset: cifar10
  hflip: true
model:
  type: conv_vae
  ch: 128
  ch_mult:
  - 1
  - 2
  - 2
  - 2
  num_res_blocks: 2
  attn_resolutions:
  - 16
  latent_dim: 128
  dropout: 0.0
  resamp_with_conv: true
  dec_logvar_min: -12.0
train:
  batch_size: 128
  total_steps: 60000
  optim:
    name: adam
    lr: 0.0002
    betas:
    - 0.9
    - 0.999
    eps: 1.0e-08
    weight_decay: 0.0
  warmup_steps: 5000
  grad_clip: 1.0
  ema_decay: 0.9999
  precision: auto
  compile: false
  log_every: 100
  eval_every: 2500
  sample_every: 5000
  snapshot_every: 10000
  ckpt_every_minutes: 15
  eval_images: 2000
